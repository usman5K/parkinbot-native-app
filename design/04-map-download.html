<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>04 · Map Download · Parkin</title>
    <link rel="stylesheet" href="css/shared.css" />
  </head>
  <body>
    <div class="stage">
      <div class="phone">
        <div class="screen">
          <div class="topbar">
            <a class="icon-btn" href="03-permissions.html" aria-label="Back">←</a>
            <div class="title">Offline maps</div>
            <span style="width: 44px"></span>
          </div>

          <p class="label">One-time download</p>
          <h1 class="h2" style="margin: 8px 0 10px">Karachi pack</h1>
          <p class="lead">Routing for walk, bike, and short drives works without signal after this.</p>

          <div class="panel-3d" style="margin-top: 24px">
            <div style="display: flex; justify-content: space-between; align-items: baseline">
              <div class="meta-title">OpenStreetMap region</div>
              <div class="caption">148 MB</div>
            </div>
            <div class="progress" id="dl" style="margin: 16px 0 10px"><i></i></div>
            <div class="caption" id="dl-status">Waiting to start…</div>
          </div>

          <div class="map-stage" style="min-height: 200px; margin-top: 20px">
            <div class="map-roads"></div>
            <div style="position: absolute; inset: 0; display: grid; place-items: center; z-index: 2">
              <div class="badge" id="map-badge">Map preview</div>
            </div>
          </div>

          <div class="spacer"></div>

          <div class="btn-row">
            <button class="btn btn-primary btn-block" id="start-dl" type="button">Download map</button>
            <a class="btn btn-ghost btn-block" href="05-home.html">Continue without (pin only)</a>
          </div>
        </div>
      </div>
    </div>
    <script src="js/app.js"></script>
    <script>
      const btn = document.getElementById("start-dl");
      const status = document.getElementById("dl-status");
      const badge = document.getElementById("map-badge");
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        btn.textContent = "Downloading…";
        status.textContent = "Fetching tiles · 0%";
        const steps = [22, 48, 71, 89, 100];
        for (const p of steps) {
          await Parkin.animateProgress("#dl", p, 420);
          status.textContent = p < 100 ? `Fetching tiles · ${p}%` : "Ready offline";
        }
        badge.textContent = "Offline · ready";
        btn.textContent = "Open Parkin";
        btn.disabled = false;
        btn.onclick = () => Parkin.go("05-home.html");
      });
    </script>
  </body>
</html>
