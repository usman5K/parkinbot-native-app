<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>12 · History · Parkin</title>
    <link rel="stylesheet" href="css/shared.css" />
  </head>
  <body>
    <div class="stage">
      <div class="phone">
        <div class="screen">
          <div class="topbar">
            <div>
              <div class="brand" style="font-size: 22px">History</div>
              <div class="caption" style="margin-top: 4px">On-device only</div>
            </div>
            <a class="icon-btn" href="05-home.html" aria-label="Map">○</a>
          </div>

          <div class="stat-row" style="margin-bottom: 8px">
            <div class="stat">
              <div class="caption">Sessions</div>
              <strong>24</strong>
            </div>
            <div class="stat">
              <div class="caption">This week</div>
              <strong>6h 40m</strong>
            </div>
          </div>

          <div class="panel-3d scroll-y" style="padding-top: 6px; padding-bottom: 6px">
            <div id="list"></div>
          </div>

          <nav class="bottom-nav">
            <a href="05-home.html"><span>○</span>Map</a>
            <a class="active" href="12-history.html"><span>☰</span>History</a>
            <a href="14-settings.html"><span>⚙</span>Prefs</a>
          </nav>
        </div>
      </div>
    </div>
    <script src="js/app.js"></script>
    <script>
      const list = document.getElementById("list");
      Parkin.MOCK.history.forEach((h, i) => {
        const a = document.createElement("a");
        a.className = "history-item";
        a.href = "13-history-detail.html";
        a.innerHTML = `
          <div class="thumb">${h.place.charAt(0)}</div>
          <div>
            <div class="meta-title">${h.place}</div>
            <div class="meta-sub">${h.start} · ${h.detail}</div>
          </div>
          <div class="caption" style="font-weight:700;color:var(--ink)">${h.duration}</div>
        `;
        list.appendChild(a);
      });
    </script>
  </body>
</html>
