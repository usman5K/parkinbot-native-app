<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>09 · Navigate · Parkin</title>
    <link rel="stylesheet" href="css/shared.css" />
  </head>
  <body>
    <div class="stage">
      <div class="phone">
        <div class="screen">
          <div class="topbar">
            <a class="icon-btn" href="08-parked.html" aria-label="Back">←</a>
            <div class="title">To vehicle</div>
            <span class="badge">Offline route</span>
          </div>

          <div class="segment" style="margin-bottom: 12px">
            <button type="button" class="active" data-mode="walk">Walk</button>
            <button type="button" data-mode="bike">Bike</button>
            <button type="button" data-mode="car">Car</button>
          </div>

          <div class="map-stage">
            <div class="map-roads"></div>
            <div class="route-line"></div>
            <div class="user-dot"></div>
            <div class="map-pin"></div>
          </div>

          <div class="panel-3d" style="margin-bottom: 12px">
            <div class="label">ETA</div>
            <div class="h2" data-mode-label style="margin-top: 4px">Walking · 4 min</div>
            <div class="meta-sub" style="margin-top: 6px">212 m · Block C · Pillar 12</div>
            <div class="stat-row" style="margin-top: 14px">
              <div class="stat">
                <div class="caption">Bearing</div>
                <strong>NE 42°</strong>
              </div>
              <div class="stat">
                <div class="caption">Photo</div>
                <strong>Yes</strong>
              </div>
            </div>
          </div>

          <div class="btn-row two">
            <a class="btn btn-ghost" href="08-parked.html">End</a>
            <a class="btn btn-primary" href="10-leave-reminder.html">I’m nearby</a>
          </div>
        </div>
      </div>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
