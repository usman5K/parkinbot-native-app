<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>13 · History Detail · Parkin</title>
    <link rel="stylesheet" href="css/shared.css" />
  </head>
  <body>
    <div class="stage">
      <div class="phone">
        <div class="screen">
          <div class="topbar">
            <a class="icon-btn" href="12-history.html" aria-label="Back">←</a>
            <div class="title">Session</div>
            <span style="width: 44px"></span>
          </div>

          <div class="scroll-y stack-lg" style="padding-bottom: 8px">
          <div class="map-stage" style="min-height: 210px; flex: 0 0 auto">
            <div class="map-roads"></div>
            <div class="map-pin"></div>
          </div>

            <div>
              <p class="label">Place</p>
              <h1 class="h2" style="margin-top: 6px">Dolmen Mall · Clifton</h1>
              <p class="lead" style="margin-top: 6px">Block C · Pillar 12</p>
            </div>

            <div class="stat-row">
              <div class="stat">
                <div class="caption">Started</div>
                <strong style="font-size: 15px">2:22 PM</strong>
              </div>
              <div class="stat">
                <div class="caption">Ended</div>
                <strong style="font-size: 15px">3:40 PM</strong>
              </div>
            </div>

            <div class="panel-3d">
              <div class="label">Details</div>
              <div class="toggle-row" style="border: none; padding-bottom: 0">
                <div>
                  <div class="meta-title">Duration</div>
                  <div class="meta-sub">Tentative parked time</div>
                </div>
                <div class="meta-title">1h 18m</div>
              </div>
              <div class="toggle-row">
                <div>
                  <div class="meta-title">Vehicle</div>
                  <div class="meta-sub">From mock profile</div>
                </div>
                <div class="meta-title">Bike</div>
              </div>
              <div class="toggle-row" style="border: none">
                <div>
                  <div class="meta-title">Coordinates</div>
                  <div class="meta-sub" data-coords>—</div>
                </div>
              </div>
            </div>

            <div class="panel-3d" style="min-height: 88px; display: grid; place-items: center; background: linear-gradient(145deg, #c8ddd8, #d5dee8)">
              <span class="caption" style="color: var(--ink-soft)">Photo reference · mock</span>
            </div>

          <a class="btn btn-ghost btn-block" href="09-navigate.html">Navigate to this spot</a>
          </div>
        </div>
      </div>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
